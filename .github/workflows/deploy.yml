name: Node.js CI

on:
  push:
    branches: [master]
    # Pushing a version tag (e.g. v1.0.3) builds the release: electron-builder
    # uploads the installers to a draft GitHub release for that version (#664).
    tags: ['v*']
  pull_request:
    branches: [master]

# Tag builds publish installers to a draft GitHub release; the default token
# needs write access to releases for that.
permissions:
  contents: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - run: yarn
      - run: yarn lint
      - run: yarn test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - run: corepack enable
      - run: yarn
      - run: yarn typecheck

  build:
    needs: ['lint']
    name: 'build'
    strategy:
      matrix:
        node-version: [22.x]
        os:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable

      - uses: maxim-lobanov/setup-xcode@v1
        if: startsWith(runner.os, 'mac')
        with:
          xcode-version: latest-stable
      - name: Download blockchain headers
        run: |
          mkdir -p ./static/daemon
          curl -o ./static/daemon/headers https://headers.lbry.io/blockchain_headers_latest
          ls ./static/daemon

      # Same as `yarn build`, but publishing only from tag builds. With no --publish,
      # electron-builder falls back to onTagOrDraft on CI, which also uploads from
      # master pushes while a draft release exists, overwriting the release's
      # installers (and implicit publishing is going away in electron-builder 27).
      # PR builds never publish. The release is named "v" + package.json version,
      # so tag the commit to match (v1.0.3 <-> "version": "1.0.3").
      - name: Build
        run: |
          yarn dlx cross-env
          yarn --network-timeout 600000
          yarn compile
          yarn electron-builder build --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # UI
          MATOMO_URL: https://analytics.lbry.com/
          MATOMO_ID: 4
          WELCOME_VERSION: 1.0
          DOMAIN: lbry.tv
          URL: https://lbry.tv
          SHARE_DOMAIN_URL: https://open.lbry.com
          SITE_TITLE: lbry.tv
          SITE_NAME: lbry.tv
          SHOW_ADS: false
          ENABLE_COMMENT_REACTIONS: true
          ENABLE_NO_SOURCE_CLAIMS: false

          DEFAULT_LANGUAGE: en
          KNOWN_APP_DOMAINS: lbry.tv,lbry.lat,odysee.com
          CHANNEL_STAKED_LEVEL_VIDEO_COMMENTS: 0

      - uses: actions/upload-artifact@v4
        if: |
          startsWith(runner.os, 'linux')
        with:
          name: Linux
          path: ./dist/electron/*.*

      - uses: actions/upload-artifact@v4
        if: |
          startsWith(runner.os, 'mac')
        with:
          name: macOS
          path: ./dist/electron/*.*

      - uses: actions/upload-artifact@v4
        if: |
          startsWith(runner.os, 'windows')
        with:
          name: Windows
          path: ./dist/electron/*.*
