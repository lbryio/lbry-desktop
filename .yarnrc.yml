nodeLinker: node-modules

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-version.cjs
    spec: "@yarnpkg/plugin-version"

yarnPath: .yarn/releases/yarn-3.2.0.cjs

# Quiet the peer warnings that are pure packaging noise (see issue #637).
# Real version-drift warnings (react 16 vs MUI, redux 3 vs redux-thunk,
# webpack ranges) are deliberately NOT silenced — they resolve via #628.
packageExtensions:
  # Stale fork forgot to declare the electron peer its own @electron/remote dep needs.
  "@meetfranz/electron-cookies@*":
    peerDependencies:
      electron: "*"
  # We don't build Squirrel Windows installers; mark the optional peer as such.
  "app-builder-lib@*":
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
  # reakit beta packaging bug: reakit-warning uses reakit-utils, which wants react-dom.
  "reakit-warning@*":
    peerDependencies:
      react-dom: "*"
  # Dead tool (removed with the Electron epic); forward the webpack peer its
  # bundled babel-loader asks for until then.
  "electron-webpack-js@*":
    peerDependencies:
      webpack: "*"
